  <text x="88" y="154" fill="white" font-family="Arial, Helvetica, sans-serif" font-size="62" font-weight="700" letter-spacing="-1.8">Hello, I’m Artur.</text>
  <text x="92" y="214" fill="#E6FFFB" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="400">I load the weights, write the harness,</text>
  <text x="92" y="254" fill="#E6FFFB" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="400">and build the flow around the model.</text>
  <text x="92" y="285" fill="#99F6E4" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" letter-spacing="4">AI ENGINEER  •  ITALY</text>
