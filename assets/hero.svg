    <circle cx="136" cy="39" r="8" fill="#8FF7E6" stroke="none"/>
    <circle cx="70" cy="78" r="10" fill="#C9FFF4" stroke="#123D52" stroke-width="4"/>
    <circle cx="4" cy="115" r="8" fill="#8FF7E6" stroke="none"/>
    <circle cx="136" cy="115" r="8" fill="#8FF7E6" stroke="none"/>
