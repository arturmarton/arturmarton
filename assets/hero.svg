<svg width="1200" height="420" viewBox="0 0 1200 420" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title description">
  <title id="title">Artur's GitHub profile</title>
  <desc id="description">A teal and navy profile banner with a greeting and short personal tagline.</desc>
  <defs>
    <linearGradient id="background" x1="42" y1="20" x2="1165" y2="426" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0F918D"/>
      <stop offset="0.58" stop-color="#125568"/>
      <stop offset="1" stop-color="#111B2E"/>
    </linearGradient>
    <linearGradient id="accent" x1="850" y1="290" x2="1090" y2="332" gradientUnits="userSpaceOnUse">
      <stop stop-color="#5EEAD4"/>
      <stop offset="1" stop-color="#A7F3D0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="420" rx="16" fill="url(#background)"/>
  <circle cx="1068" cy="-26" r="205" fill="#5EEAD4" fill-opacity=".06"/>
  <circle cx="1140" cy="20" r="133" fill="#A7F3D0" fill-opacity=".05"/>
  <path d="M-14 351C98 284 210 359 304 319C397 279 443 203 550 234C672 270 647 370 765 383C878 396 932 287 1018 306C1100 324 1130 392 1218 358V420H-14V351Z" fill="#071827" fill-opacity=".18"/>
  <!-- A compact, hand-drawn AI-systems mark: nodes, layers, and their connections. -->
  <g transform="translate(769 102)" stroke="#8FF7E6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M70 1L136 39V115L70 153L4 115V39L70 1Z" stroke-width="3" opacity=".94"/>
    <path d="M4 39L70 78L136 39M70 78V153" stroke-width="3" opacity=".66"/>
    <circle cx="70" cy="1" r="8" fill="#8FF7E6" stroke="none"/>
